{% extends "base.html" %}

{% block content %}
<div style="max-width: 460px; margin: 2.5rem auto;">
  <div class="card" style="padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <div style="width: 48px; height: 48px; border-radius: var(--radius-md); background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 0.75rem;">
        🚀
      </div>
      <h2 style="font-size: 1.6rem; margin-bottom: 0.35rem;">Create Your Account</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Start planning with PocketSmart AI today</p>
    </div>

    <div id="registerAlert" class="alert alert-danger" style="display: none;"></div>

    <form id="registerForm">
      <div class="form-group">
        <label class="form-label" for="full_name">Full Name <span class="required">*</span></label>
        <input type="text" id="full_name" class="form-control" placeholder="Jane Doe" required minlength="2">
      </div>

      <div class="form-group">
        <label class="form-label" for="reg_email">Email Address <span class="required">*</span></label>
        <input type="email" id="reg_email" class="form-control" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg_password">Password <span class="required">*</span></label>
        <input type="password" id="reg_password" class="form-control" placeholder="At least 6 characters" required minlength="6">
      </div>

      <div class="form-group">
        <label class="form-label" for="reg_confirm_password">Confirm Password <span class="required">*</span></label>
        <input type="password" id="reg_confirm_password" class="form-control" placeholder="Re-enter password" required minlength="6">
      </div>

      <button type="submit" id="regSubmitBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
        Create Account &rarr;
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
      Already have an account? <a href="/login" style="font-weight: 600;">Sign in here</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById('registerAlert');
  const submitBtn = document.getElementById('regSubmitBtn');
  alertBox.style.display = 'none';

  const full_name = document.getElementById('full_name').value.trim();
  const email = document.getElementById('reg_email').value.trim();
  const password = document.getElementById('reg_password').value;
  const confirm_password = document.getElementById('reg_confirm_password').value;

  if (password !== confirm_password) {
    alertBox.innerText = 'Passwords do not match. Please re-enter.';
    alertBox.style.display = 'flex';
    return;
  }

  submitBtn.disabled = true;
  submitBtn.innerText = 'Creating account...';

  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ full_name, email, password, confirm_password })
    });

    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.detail || 'Registration failed. Please check inputs.');
    }

    showToast('Account created! Logging you in...', 'success');
    
    // Auto-login
    const loginRes = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    if (loginRes.ok) {
      setTimeout(() => { window.location.href = '/dashboard'; }, 600);
    } else {
      window.location.href = '/login?registered=1';
    }

  } catch (err) {
    alertBox.innerText = err.message;
    alertBox.style.display = 'flex';
    submitBtn.disabled = false;
    submitBtn.innerText = 'Create Account →';
  }
});
</script>
{% endblock %}
