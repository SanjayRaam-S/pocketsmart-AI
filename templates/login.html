{% extends "base.html" %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card" style="padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <div style="width: 48px; height: 48px; border-radius: var(--radius-md); background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 0.75rem;">
        🔐
      </div>
      <h2 style="font-size: 1.6rem; margin-bottom: 0.35rem;">Welcome Back</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to your PocketSmart AI dashboard</p>
    </div>

    <div id="loginAlert" class="alert alert-danger" style="display: none;"></div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="email">Email Address <span class="required">*</span></label>
        <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password <span class="required">*</span></label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
        Sign In &rarr;
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
      Don't have an account? <a href="/register" style="font-weight: 600;">Sign up free</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById('loginAlert');
  const submitBtn = document.getElementById('submitBtn');
  alertBox.style.display = 'none';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  submitBtn.disabled = true;
  submitBtn.innerText = 'Verifying credentials...';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.detail || 'Invalid email or password.');
    }

    showToast('Signed in successfully! Redirecting...', 'success');
    
    // Check if next redirect exists
    const urlParams = new URLSearchParams(window.location.search);
    const next = urlParams.get('next') || '/dashboard';
    setTimeout(() => { window.location.href = next; }, 600);

  } catch (err) {
    alertBox.innerText = err.message;
    alertBox.style.display = 'flex';
    submitBtn.disabled = false;
    submitBtn.innerText = 'Sign In →';
  }
});
</script>
{% endblock %}
